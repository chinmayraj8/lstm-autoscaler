# Minimal in-cluster runner for the observer service (Step 23, Stage 5).
#
# Scope, stated plainly: JUST enough to run Stage 4's live forecasting loop
# + the /shadow/* FastAPI endpoints continuously inside the cluster,
# talking to Prometheus via in-cluster DNS -- not the broader Part 2
# Docker/Kubernetes deployment work. No HorizontalPodAutoscaler, no
# NetworkPolicy, no Ingress, no resource-limit tuning beyond a sane
# starting guess, no RBAC (this service only ever makes outbound HTTP GETs
# to Prometheus -- it never talks to the Kubernetes API, so no
# ServiceAccount/Role is needed). A separate namespace from `monitoring` on
# purpose: this is a new, independent workload, not part of the
# kube-prometheus-stack release.
#
# BEFORE APPLYING: build the image, then push it to a registry the
# cluster can actually see -- on a `docker-desktop` Kubernetes context
# (kubectl config current-context), that means a throwaway local registry,
# NOT a shared image store: Docker Desktop's Kubernetes node reads images
# via containerd's `k8s.io` namespace, which `docker build` does not write
# to (it writes to the separate `moby` namespace), so `imagePullPolicy:
# Never` against a plain local build tag will hang in ErrImageNeverPull --
# confirmed on this machine, this is not a hypothetical.
#   docker build -t lstm-autoscaler-observer:latest .
#   docker run -d --restart=always -p 5000:5000 --name local-registry registry:2
#   docker tag lstm-autoscaler-observer:latest localhost:5000/lstm-autoscaler-observer:latest
#   docker push localhost:5000/lstm-autoscaler-observer:latest
# (see the Dockerfile's own comments and this stage's progress doc). The
# Deployment below already references `localhost:5000/...` with
# `imagePullPolicy: IfNotPresent`. If you deploy to a DIFFERENT cluster (a
# remote/managed one, or `kind`), swap in a registry it can reach instead
# (or `kind load docker-image ...`).
#
# Persistence: a PersistentVolumeClaim is included below (`storageClassName`
# left unset -- uses the cluster's default StorageClass) so shadow_state.db
# survives a pod restart/reschedule. This was a deliberate choice this
# stage was asked to make explicitly, not a default: SQLite (Step 19) is
# single-writer-friendly, matching this Deployment's `replicas: 1` --
# scaling replicas beyond 1 against the SAME PVC path would need a
# different store, not just a bigger claim, so don't raise `replicas`
# without addressing that first. See the progress doc's "Still open" for
# what this PVC does NOT solve (untested against the real cluster's actual
# default StorageClass; no backup/snapshot policy).

apiVersion: v1
kind: Namespace
metadata:
  name: lstm-autoscaler
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: observer-shadow-state
  namespace: lstm-autoscaler
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lstm-autoscaler-observer
  namespace: lstm-autoscaler
  labels:
    app: lstm-autoscaler-observer
spec:
  replicas: 1   # see PVC note above before ever raising this
  selector:
    matchLabels:
      app: lstm-autoscaler-observer
  template:
    metadata:
      labels:
        app: lstm-autoscaler-observer
    spec:
      # Step 26: needed only for real actuation (get/patch on
      # deployments/scale, nothing else -- see k8s/actuation-rbac.yaml,
      # which must be applied for this ServiceAccount to actually exist).
      # Harmless to leave set even with actuation disabled -- an unused
      # ServiceAccount grants nothing by itself if actuation never fires.
      serviceAccountName: lstm-autoscaler-observer
      containers:
        - name: observer
          image: localhost:5000/lstm-autoscaler-observer:step26
          # CORRECTION: Docker Desktop's Kubernetes does NOT actually share
          # `docker build`'s image store with the cluster -- kubelet reads
          # images from containerd's `k8s.io` namespace, while `docker
          # build` writes into the separate `moby` namespace. Confirmed on
          # this machine: imagePullPolicy: Never left the pod stuck in
          # ErrImageNeverPull even after a successful local build + rollout
          # restart. Fix that actually works: run a throwaway local
          # registry and push the image there (Docker Desktop's k8s node
          # can reach localhost:5000 directly) --
          #   docker run -d --restart=always -p 5000:5000 --name local-registry registry:2
          #   docker tag lstm-autoscaler-observer:latest localhost:5000/lstm-autoscaler-observer:<tag>
          #   docker push localhost:5000/lstm-autoscaler-observer:<tag>
          # SECOND CORRECTION (Step 25): don't reuse `:latest` as that <tag>
          # once a pod has already pulled it once. `imagePullPolicy:
          # IfNotPresent` means exactly what it says -- kubelet checks
          # whether that IMAGE REFERENCE (repo+tag) is already present on
          # the node, not whether the registry's content under that tag has
          # changed, so re-pushing `:latest` with new content and then just
          # restarting the pod (even via `kubectl rollout restart`) silently
          # keeps serving the STALE cached build -- confirmed on this
          # machine (Step 25: a rebuilt image with a real logging fix in it
          # didn't take effect until re-tagged). Use a unique tag per build
          # you need the cluster to actually pick up (a version, a git SHA,
          # a timestamp -- `step25` here is just this step's own marker, not
          # a versioning scheme to keep using) and update this field to
          # match, or delete/recreate the pod after removing the stale image
          # from the node.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            # Confirmed working in-cluster Prometheus URL (kube-prometheus-stack
            # default Service DNS name).
            - name: LSTM_AUTOSCALER_PROMETHEUS_URL
              value: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
            # No CSV dataset or lstm_model.keras in this image -- /forecast
            # returns 503; /shadow/* and the live loop are unaffected.
            - name: LSTM_AUTOSCALER_SKIP_LSTM_MODEL
              value: "1"
            - name: LSTM_AUTOSCALER_SHADOW_DB
              value: "/data/shadow_state.db"
            - name: LSTM_AUTOSCALER_TICK_SECONDS
              value: "300"
            # LSTM_AUTOSCALER_TRACKED_NODES intentionally unset -- the live
            # loop discovers tracked nodes itself each tick via
            # PrometheusMetricsSource.list_machine_ids() (Step 21). Set this
            # to a comma-separated list instead if you want a fixed node set.
            #
            # Placeholder residual-hybrid model directory (Step 25), on the
            # PVC so it survives a restart like shadow_state.db does.
            # Left wired (an empty directory today -- Step 25's one-off
            # placeholder .keras file was deleted after that step's demo,
            # see its progress doc's "Decision" section) so a real model
            # can be dropped in later without a manifest change. Its mere
            # presence would never, on its own, mean the hybrid forecaster
            # is validated for real use -- that still requires a real
            # trained artifact, which does not exist.
            - name: LSTM_AUTOSCALER_HYBRID_MODEL_DIR
              value: "/data/hybrid_residual"
            # LSTM_AUTOSCALER_SHADOW_FIT_HOURS/_WINDOW_HOURS: intentionally
            # UNSET here. Step 25 temporarily overrode these (to ~1h
            # instead of the code defaults 6h/24h = 30h) to mechanically
            # demo the ARIMA-vs-hybrid shadow-window scoring pipeline
            # against a cluster that didn't have 30h of history yet --
            # see that step's progress doc for what was proven and why.
            # Reverted after: this deployment now runs the real 6h-fit/
            # 24h-window methodology again (LiveLoopConfig's code
            # defaults). Do not re-add these as small values outside of a
            # similarly explicit, flagged, temporary demo.
            #
            # Step 26 -- real actuation. ENABLED below, targeting
            # 172.18.0.3. NOTE: 172.18.0.2 was the original choice, but two
            # consecutive live ticks (2026-09-04 08:26 and 08:31) logged
            # observed decisions for 172.18.0.3 and 172.18.0.5 only --
            # nothing at all for 172.18.0.2, not even a failure line. Root
            # cause: resolve_tracked_machine_ids() re-discovers live nodes
            # from Prometheus every tick (PrometheusMetricsSource.
            # list_machine_ids) rather than trusting a fixed list, so a
            # machine_id can exist historically in shadow_state.db's
            # machines table (from a past tick) without being a currently
            # live Prometheus target. 172.18.0.2 is most likely a stale
            # node-exporter instance IP from an earlier Docker Desktop
            # Kubernetes network state -- Docker Desktop can reassign node
            # IPs across restarts -- and simply isn't scraped any more, so
            # it never enters machine_ids and the actuation branch (which
            # only ever runs for a machine_id actually present in that
            # tick's loop) never triggers for it. This is the live-discovery
            # design working as intended, not a bug in it: a hardcoded
            # tracked-node list would have masked this instead of surfacing
            # it. 172.18.0.3 and 172.18.0.5 are both confirmed live across
            # multiple ticks; 172.18.0.3 is the one now wired for real
            # actuation. This is an explicit, deliberate opt-in -- every
            # deployment through Step 25 left LSTM_AUTOSCALER_ENABLE_ACTUATION
            # unset (main.py's default of False), so actuation never fired.
            # Requires k8s/actuation-rbac.yaml and k8s/demo-workload.yaml to
            # already be applied (ServiceAccount/Role/RoleBinding for
            # deployments/scale, and the demo-workload Deployment being
            # scaled). To go back to observe-only, delete these two env
            # vars (or set LSTM_AUTOSCALER_ENABLE_ACTUATION back to "0"/
            # unset) and re-apply.
            - name: LSTM_AUTOSCALER_ENABLE_ACTUATION
              value: "1"
            - name: LSTM_AUTOSCALER_ACTUATION_MACHINE_ID
              value: "172.18.0.3"
            # LSTM_AUTOSCALER_ACTUATION_DEPLOYMENT / _NAMESPACE are left at
            # their defaults (demo-workload / lstm-autoscaler) and don't
            # need setting unless you rename k8s/demo-workload.yaml's target.
          volumeMounts:
            - name: shadow-state
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            # Step 25: bumped from the original 256Mi/512Mi (Step 23's "sane
            # starting guess," never actually exercised against a real
            # TensorFlow model load) after directly observing an OOMKilled
            # container at 512Mi while loading the placeholder hybrid model
            # (a second, separate TF process via `kubectl exec` alongside
            # the already-TF-loaded main process -- the main process's own
            # in-process tick did NOT crash the pod, but this wasn't margin
            # this deployment had verified before, and the observer-only
            # ARIMA path (Steps 21-24) never loads a Keras model at all, so
            # 512Mi was never actually tested against this cluster's real
            # TensorFlow footprint until this step. Left at the higher
            # value going forward rather than reverted, since the hybrid
            # path (dormant but wired since Step 22) can legitimately be
            # exercised again later and would hit the same ceiling.
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: shadow-state
          persistentVolumeClaim:
            claimName: observer-shadow-state
---
apiVersion: v1
kind: Service
metadata:
  name: lstm-autoscaler-observer
  namespace: lstm-autoscaler
spec:
  selector:
    app: lstm-autoscaler-observer
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
