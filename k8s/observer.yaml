# Minimal in-cluster runner for the observer service (Step 23, Stage 5).
#
# Scope, stated plainly: JUST enough to run Stage 4's live forecasting loop
# + the /shadow/* FastAPI endpoints continuously inside the cluster,
# talking to Prometheus via in-cluster DNS -- not the broader Part 2
# Docker/Kubernetes deployment work. No HorizontalPodAutoscaler, no
# Ingress, no resource-limit tuning beyond a sane starting guess.
# CORRECTION (security hardening pass): the line that used to be here --
# "no RBAC, this service never talks to the Kubernetes API" -- stopped
# being true the moment Step 26 added real actuation. This pod DOES now
# have a ServiceAccount (see k8s/actuation-rbac.yaml, get/patch on
# deployments/scale only) and DOES talk to the real Kubernetes API server.
# A NetworkPolicy is included below for exactly that reason. A separate
# namespace from `monitoring` on purpose: this is a new, independent
# workload, not part of the kube-prometheus-stack release.
#
# BEFORE APPLYING: build the image, then push it to a registry the
# cluster can actually see -- on a `docker-desktop` Kubernetes context
# (kubectl config current-context), that means a throwaway local registry,
# NOT a shared image store: Docker Desktop's Kubernetes node reads images
# via containerd's `k8s.io` namespace, which `docker build` does not write
# to (it writes to the separate `moby` namespace), so `imagePullPolicy:
# Never` against a plain local build tag will hang in ErrImageNeverPull --
# confirmed on this machine, this is not a hypothetical.
#   docker build -t lstm-autoscaler-observer:latest .
#   docker run -d --restart=always -p 5000:5000 --name local-registry registry:2
#   docker tag lstm-autoscaler-observer:latest localhost:5000/lstm-autoscaler-observer:latest
#   docker push localhost:5000/lstm-autoscaler-observer:latest
# (see the Dockerfile's own comments and this stage's progress doc). The
# Deployment below already references `localhost:5000/...` with
# `imagePullPolicy: IfNotPresent`. If you deploy to a DIFFERENT cluster (a
# remote/managed one, or `kind`), swap in a registry it can reach instead
# (or `kind load docker-image ...`).
#
# Persistence: a PersistentVolumeClaim is included below (`storageClassName`
# left unset -- uses the cluster's default StorageClass) so shadow_state.db
# survives a pod restart/reschedule. This was a deliberate choice this
# stage was asked to make explicitly, not a default: SQLite (Step 19) is
# single-writer-friendly, matching this Deployment's `replicas: 1` --
# scaling replicas beyond 1 against the SAME PVC path would need a
# different store, not just a bigger claim, so don't raise `replicas`
# without addressing that first. See the progress doc's "Still open" for
# what this PVC does NOT solve (untested against the real cluster's actual
# default StorageClass; no backup/snapshot policy).

apiVersion: v1
kind: Namespace
metadata:
  name: lstm-autoscaler
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: observer-shadow-state
  namespace: lstm-autoscaler
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lstm-autoscaler-observer
  namespace: lstm-autoscaler
  labels:
    app: lstm-autoscaler-observer
spec:
  replicas: 1   # see PVC note above before ever raising this
  selector:
    matchLabels:
      app: lstm-autoscaler-observer
  template:
    metadata:
      labels:
        app: lstm-autoscaler-observer
    spec:
      # Step 26: needed only for real actuation (get/patch on
      # deployments/scale, nothing else -- see k8s/actuation-rbac.yaml,
      # which must be applied for this ServiceAccount to actually exist).
      # Harmless to leave set even with actuation disabled -- an unused
      # ServiceAccount grants nothing by itself if actuation never fires.
      serviceAccountName: lstm-autoscaler-observer
      # Pod-level fsGroup: kept as the portable, generally-correct thing to
      # declare (kubelet chgrp's + chmod g+rwX's most volume types to this
      # GID on mount, and appuser's group -- see Dockerfile's `useradd` --
      # is also 1000), but it is a documented no-op for THIS cluster's
      # actual volume: `kubectl get pv <name> -o yaml` shows
      # observer-shadow-state is backed by a plain `hostPath`
      # (local-path-provisioner), and Kubernetes' own docs are explicit
      # that fsGroup ownership management does not apply to hostPath
      # volumes. Confirmed the hard way: this alone did NOT fix the
      # failure below, the initContainer did.
      securityContext:
        fsGroup: 1000
      # This PVC has real pre-existing data written back when this
      # container ran as root -- shadow_state.db on disk was
      # `-rw-r--r-- root root`, so switching the main container to a
      # non-root UID left it able to READ that file but not WRITE to it
      # (confirmed on the first real rollout of this hardening pass:
      # sqlite3.OperationalError: attempt to write a readonly database --
      # nothing to do with readOnlyRootFilesystem itself, which only
      # governs the root FS, not this PVC mount). A brief, root-only
      # initContainer -- the one place in this whole manifest that still
      # runs as root, and only for as long as one `chown` takes -- fixes
      # ownership once. Idempotent: on every future pod start this is just
      # a no-op chown of already-1000-owned files.
      initContainers:
        - name: fix-data-permissions
          image: localhost:5000/lstm-autoscaler-observer:security-20260914
          command: ["chown", "-R", "1000:1000", "/data"]
          # `drop: ["ALL"]` alone strips CAP_CHOWN even from UID 0 --
          # confirmed the hard way, `chown` failed with "Operation not
          # permitted" as root until CAP_CHOWN was added back explicitly.
          # Least privilege even for the one root process in this
          # manifest: root, but with ONLY the capability this single
          # command actually needs, nothing else.
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - name: shadow-state
              mountPath: /data
      containers:
        - name: observer
          # THIRD CORRECTION (security hardening pass): ATTEMPTED a digest
          # pin here (`@sha256:...`) instead of a mutable tag, from this
          # exact build --
          #   docker push localhost:5000/lstm-autoscaler-observer:security-20260914
          #   -> Docker-Content-Digest: sha256:03549fad511becaf6dc2f6a7cb7ea353e4c506213e5953418ef4425e446e6102
          # (confirmed against the registry's own manifest API, and `docker
          # pull` of that exact digest succeeds from this machine) -- but
          # this specific Docker Desktop Kubernetes node could not actually
          # USE it: its containerd resolves image references through an
          # internal `registry-mirror:1273` proxy, and a HEAD request for
          # ANY digest reference against this local registry (the manifest
          # list's own digest above, and separately the platform-specific
          # linux/arm64 manifest digest underneath it) 500s through that
          # mirror -- `kubectl describe pod` showed
          # "unexpected status from HEAD request to
          # http://registry-mirror:1273/v2/.../manifests/sha256:...:
          # 500 Internal Server Error" for both, while the identical tag
          # reference pulls fine. Verified, not assumed, before reverting.
          #
          # HONESTY CHECK, stated plainly rather than implied: even where
          # digest pinning DOES work, this is a throwaway, unauthenticated
          # `registry:2` container on localhost:5000 -- anyone with docker
          # access to this machine can push a different image under the
          # same tag, or run their own registry and have this cluster pull
          # from it. A digest pin would demonstrate the PRACTICE (this
          # exact, verified set of bytes, not "whatever a tag happens to
          # resolve to today"), never real supply-chain provenance -- that
          # needs a signed, content-addressed image in an actual registry
          # with access control, which this local setup deliberately isn't
          # and, on this node, currently can't even mechanically pull by
          # digest regardless. The unique-tag-per-build discipline the
          # SECOND CORRECTION below already established is the practical
          # substitute here: not equivalent to a real digest pin, but it
          # gets the same "this reference can't silently point at
          # different bytes" property in practice, since a tag is never
          # reused across builds.
          image: localhost:5000/lstm-autoscaler-observer:security-20260914
          # CORRECTION: Docker Desktop's Kubernetes does NOT actually share
          # `docker build`'s image store with the cluster -- kubelet reads
          # images from containerd's `k8s.io` namespace, while `docker
          # build` writes into the separate `moby` namespace. Confirmed on
          # this machine: imagePullPolicy: Never left the pod stuck in
          # ErrImageNeverPull even after a successful local build + rollout
          # restart. Fix that actually works: run a throwaway local
          # registry and push the image there (Docker Desktop's k8s node
          # can reach localhost:5000 directly) --
          #   docker run -d --restart=always -p 5000:5000 --name local-registry registry:2
          #   docker tag lstm-autoscaler-observer:latest localhost:5000/lstm-autoscaler-observer:<tag>
          #   docker push localhost:5000/lstm-autoscaler-observer:<tag>
          # SECOND CORRECTION (Step 25): don't reuse `:latest` as that <tag>
          # once a pod has already pulled it once. `imagePullPolicy:
          # IfNotPresent` means exactly what it says -- kubelet checks
          # whether that IMAGE REFERENCE (repo+tag) is already present on
          # the node, not whether the registry's content under that tag has
          # changed, so re-pushing `:latest` with new content and then just
          # restarting the pod (even via `kubectl rollout restart`) silently
          # keeps serving the STALE cached build -- confirmed on this
          # machine (Step 25: a rebuilt image with a real logging fix in it
          # didn't take effect until re-tagged). Use a unique tag per build
          # you need the cluster to actually pick up (a version, a git SHA,
          # a timestamp -- `step25` here is just this step's own marker, not
          # a versioning scheme to keep using) and update this field to
          # match, or delete/recreate the pod after removing the stale image
          # from the node.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            # Confirmed working in-cluster Prometheus URL (kube-prometheus-stack
            # default Service DNS name).
            - name: LSTM_AUTOSCALER_PROMETHEUS_URL
              value: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
            # Bearer-token auth for every route except GET /health (see
            # require_auth in src/api/main.py). Sourced from a Secret --
            # never a plaintext value in this file. Create it once per
            # cluster before applying this manifest:
            #   kubectl create secret generic lstm-autoscaler-api-token \
            #     -n lstm-autoscaler \
            #     --from-literal=token="$(openssl rand -hex 32)"
            # If the Secret doesn't exist, the pod fails to start (missing
            # secretKeyRef) rather than silently running with auth
            # disabled -- if you want to run without auth on purpose,
            # remove this env entry rather than skipping the Secret.
            - name: LSTM_AUTOSCALER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lstm-autoscaler-api-token
                  key: token
            # No CSV dataset or lstm_model.keras in this image -- /forecast
            # returns 503; /shadow/* and the live loop are unaffected.
            - name: LSTM_AUTOSCALER_SKIP_LSTM_MODEL
              value: "1"
            - name: LSTM_AUTOSCALER_SHADOW_DB
              value: "/data/shadow_state.db"
            - name: LSTM_AUTOSCALER_TICK_SECONDS
              value: "300"
            # LSTM_AUTOSCALER_TRACKED_NODES intentionally unset -- the live
            # loop discovers tracked nodes itself each tick via
            # PrometheusMetricsSource.list_machine_ids() (Step 21). Set this
            # to a comma-separated list instead if you want a fixed node set.
            #
            # Placeholder residual-hybrid model directory (Step 25), on the
            # PVC so it survives a restart like shadow_state.db does.
            # Left wired (an empty directory today -- Step 25's one-off
            # placeholder .keras file was deleted after that step's demo,
            # see its progress doc's "Decision" section) so a real model
            # can be dropped in later without a manifest change. Its mere
            # presence would never, on its own, mean the hybrid forecaster
            # is validated for real use -- that still requires a real
            # trained artifact, which does not exist.
            - name: LSTM_AUTOSCALER_HYBRID_MODEL_DIR
              value: "/data/hybrid_residual"
            # LSTM_AUTOSCALER_SHADOW_FIT_HOURS/_WINDOW_HOURS: intentionally
            # UNSET here. Step 25 temporarily overrode these (to ~1h
            # instead of the code defaults 6h/24h = 30h) to mechanically
            # demo the ARIMA-vs-hybrid shadow-window scoring pipeline
            # against a cluster that didn't have 30h of history yet --
            # see that step's progress doc for what was proven and why.
            # Reverted after: this deployment now runs the real 6h-fit/
            # 24h-window methodology again (LiveLoopConfig's code
            # defaults). Do not re-add these as small values outside of a
            # similarly explicit, flagged, temporary demo.
            #
            # Step 26 -- real actuation. ENABLED below, targeting
            # 172.18.0.3. NOTE: 172.18.0.2 was the original choice, but two
            # consecutive live ticks (2026-09-04 08:26 and 08:31) logged
            # observed decisions for 172.18.0.3 and 172.18.0.5 only --
            # nothing at all for 172.18.0.2, not even a failure line. Root
            # cause: resolve_tracked_machine_ids() re-discovers live nodes
            # from Prometheus every tick (PrometheusMetricsSource.
            # list_machine_ids) rather than trusting a fixed list, so a
            # machine_id can exist historically in shadow_state.db's
            # machines table (from a past tick) without being a currently
            # live Prometheus target. 172.18.0.2 is most likely a stale
            # node-exporter instance IP from an earlier Docker Desktop
            # Kubernetes network state -- Docker Desktop can reassign node
            # IPs across restarts -- and simply isn't scraped any more, so
            # it never enters machine_ids and the actuation branch (which
            # only ever runs for a machine_id actually present in that
            # tick's loop) never triggers for it. This is the live-discovery
            # design working as intended, not a bug in it: a hardcoded
            # tracked-node list would have masked this instead of surfacing
            # it. 172.18.0.3 and 172.18.0.5 are both confirmed live across
            # multiple ticks; 172.18.0.3 is the one now wired for real
            # actuation. This is an explicit, deliberate opt-in -- every
            # deployment through Step 25 left LSTM_AUTOSCALER_ENABLE_ACTUATION
            # unset (main.py's default of False), so actuation never fired.
            # Requires k8s/actuation-rbac.yaml and k8s/demo-workload.yaml to
            # already be applied (ServiceAccount/Role/RoleBinding for
            # deployments/scale, and the demo-workload Deployment being
            # scaled). To go back to observe-only, delete these two env
            # vars (or set LSTM_AUTOSCALER_ENABLE_ACTUATION back to "0"/
            # unset) and re-apply.
            - name: LSTM_AUTOSCALER_ENABLE_ACTUATION
              value: "1"
            - name: LSTM_AUTOSCALER_ACTUATION_MACHINE_ID
              value: "172.18.0.3"
            # LSTM_AUTOSCALER_ACTUATION_DEPLOYMENT / _NAMESPACE are left at
            # their defaults (demo-workload / lstm-autoscaler) and don't
            # need setting unless you rename k8s/demo-workload.yaml's target.
          # Security hardening pass: drop everything the container doesn't
          # actually need. runAsUser: 1000 matches the Dockerfile's own
          # `useradd -u 1000 appuser`. readOnlyRootFilesystem is safe here
          # specifically BECAUSE the only two real write paths
          # (shadow_state.db, the hybrid-model dir) already live on the
          # `shadow-state` PVC mount below, not on the root filesystem --
          # confirmed by checking every LSTM_AUTOSCALER_* path this
          # container writes to. The `tmp` emptyDir exists purely
          # defensively: Python/TensorFlow/uvicorn can want scratch space
          # under /tmp, and a read-only root FS turns "wanted to write a
          # temp file" into a startup crash that's annoying to root-cause
          # from a CrashLoopBackOff with no other symptom.
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: shadow-state
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            # Step 25: bumped from the original 256Mi/512Mi (Step 23's "sane
            # starting guess," never actually exercised against a real
            # TensorFlow model load) after directly observing an OOMKilled
            # container at 512Mi while loading the placeholder hybrid model
            # (a second, separate TF process via `kubectl exec` alongside
            # the already-TF-loaded main process -- the main process's own
            # in-process tick did NOT crash the pod, but this wasn't margin
            # this deployment had verified before, and the observer-only
            # ARIMA path (Steps 21-24) never loads a Keras model at all, so
            # 512Mi was never actually tested against this cluster's real
            # TensorFlow footprint until this step. Left at the higher
            # value going forward rather than reverted, since the hybrid
            # path (dormant but wired since Step 22) can legitimately be
            # exercised again later and would hit the same ceiling.
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: shadow-state
          persistentVolumeClaim:
            claimName: observer-shadow-state
        - name: tmp
          emptyDir: {}
---
# ClusterIP -- not NodePort/LoadBalancer. Both were tried and empirically
# ruled out as a way to give the browser-based frontend a stable address
# without a `kubectl port-forward` process running: `docker port
# desktop-worker`/`desktop-control-plane` shows Docker Desktop's
# Kubernetes VM only forwards 6443 (the API server) to the Mac host --
# NOT the NodePort range, and switching this Service to `type:
# LoadBalancer` got an EXTERNAL-IP that was just another in-cluster IP,
# not `localhost`, and was equally unreachable from the host. Neither
# result matches what's sometimes documented for other
# Docker-Desktop-Kubernetes versions/configurations -- verified against
# THIS machine's actual behavior rather than assumed. The real fix for
# host reachability is a macOS LaunchAgent that keeps a
# `kubectl port-forward` alive permanently (auto-starts at login,
# auto-restarts if it dies) -- see scripts/observer-port-forward.plist
# and README.md. This Service stays ClusterIP because that's genuinely
# all it needs to be: the LaunchAgent's port-forward and the
# ServiceMonitor's in-cluster scrape both only ever need ClusterIP-level
# reachability, nothing more.
apiVersion: v1
kind: Service
metadata:
  name: lstm-autoscaler-observer
  namespace: lstm-autoscaler
  labels:
    app: lstm-autoscaler-observer
spec:
  selector:
    app: lstm-autoscaler-observer
  ports:
    # Named so the ServiceMonitor below can reference it by name instead of
    # by number -- required for a ServiceMonitor endpoint's `port` field.
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP
---
# Scrapes GET /metrics (src/autoscaler/instrumentation.py) via the
# Prometheus Operator's usual discovery mechanism, instead of hand-editing
# kube-prometheus-stack's prometheus.yml directly -- this cluster runs the
# Operator (confirmed: `kubectl get prometheus -n monitoring` returns a
# CR), so a ServiceMonitor is the idiomatic way to add a scrape target.
#
# Must live in the SAME namespace as the Service it targets (lstm-autoscaler,
# not monitoring) so `bearerTokenSecret` below can resolve the
# lstm-autoscaler-api-token Secret -- cross-namespace secret references
# aren't supported by the ServiceMonitor CRD. `namespaceSelector` still
# needs to explicitly list lstm-autoscaler for the Operator's Prometheus-
# config generator to actually look there for the target Service.
#
# `release: kube-prometheus-stack` matches this cluster's real Prometheus
# CR's `spec.serviceMonitorSelector.matchLabels` (checked via
# `kubectl get prometheus -n monitoring -o yaml`) -- required, or this
# ServiceMonitor is silently ignored rather than erroring.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lstm-autoscaler-observer
  namespace: lstm-autoscaler
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: lstm-autoscaler-observer
  namespaceSelector:
    matchNames:
      - lstm-autoscaler
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      # Requires the Secret to actually exist first:
      #   kubectl create secret generic lstm-autoscaler-api-token \
      #     -n lstm-autoscaler \
      #     --from-literal=token="$(openssl rand -hex 32)"
      # (the same Secret the Deployment above already reads
      # LSTM_AUTOSCALER_API_TOKEN from) -- if it's ever deleted without
      # updating this ServiceMonitor too, the target starts failing with
      # 401s, not silently scraping unauthenticated.
      bearerTokenSecret:
        name: lstm-autoscaler-api-token
        key: token
---
# Default-deny NetworkPolicy: an empty `ingress`/`egress` list under a
# matching `policyTypes` entry means "deny everything not explicitly
# allowed below," not "no policy" -- this pod gets exactly the following
# and nothing else.
#
# HONESTY CHECK, same spirit as the digest-pin comment on the Deployment
# above: this cluster is Docker Desktop's built-in Kubernetes, which runs
# on `kind` under the hood with `kindnet` as its CNI (confirmed via
# `kubectl get pods -n kube-system` -- the `kindnet-*` DaemonSet, no
# Calico/Cilium/Antrea anywhere). kindnet does NOT implement the
# NetworkPolicy API at all -- kind's own docs are explicit about this.
# Applying this file is accepted by the API server and IS a real object,
# but on THIS cluster today it enforces nothing; every rule below is
# correct and would take effect immediately on a NetworkPolicy-capable CNI
# (Calico, Cilium, etc.), but here it's a documented intent, not an active
# control. Verified, not assumed: after applying, the pod's egress to
# Prometheus and the API server, and Prometheus's scrape of it, all kept
# working exactly as before -- which is itself the evidence this policy
# isn't actually being enforced here, not proof that it's correctly
# permissive (a real enforcement pass would need a NetworkPolicy-capable
# CNI to actually test against).
#
# Ingress: ONLY the real Prometheus scrape (monitoring namespace, the
# same pod selector kube-prometheus-stack-prometheus's own Service uses)
# on the container port. The frontend reaches this pod exclusively via
# `kubectl port-forward`, which tunnels through the API server/kubelet
# directly into the pod's network namespace -- it never traverses the pod
# network the CNI enforces NetworkPolicy on, so it needs no ingress rule
# here and none is added.
#
# Egress: DNS (CoreDNS, kube-system) -- without this, a default-deny
# egress policy silently breaks every Service DNS lookup this pod makes,
# including the two rules below; Prometheus (monitoring namespace) on
# 9090, for PrometheusMetricsSource's real history reads; and the
# Kubernetes API server for actuator.py's real get/patch calls (Step 26).
# The API server's Service (`kubernetes.default.svc`) has NO selector --
# traffic to its ClusterIP gets DNAT'd to the control-plane node's real
# IP:port before a podSelector/namespaceSelector peer could ever match it
# -- so this uses an `ipBlock` for that real endpoint instead (from
# `kubectl get endpoints kubernetes -n default`). That IP is this
# cluster's own control-plane node address and is NOT portable to a
# different cluster; re-check it if this cluster is ever torn down and
# recreated, not just restarted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lstm-autoscaler-observer
  namespace: lstm-autoscaler
spec:
  podSelector:
    matchLabels:
      app: lstm-autoscaler-observer
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              operator.prometheus.io/name: kube-prometheus-stack-prometheus
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              operator.prometheus.io/name: kube-prometheus-stack-prometheus
      ports:
        - protocol: TCP
          port: 9090
    - to:
        # The real kube-apiserver endpoint on THIS cluster (control-plane
        # node IP:6443) -- see the comment above on why an ipBlock, not a
        # selector, is what's needed here.
        - ipBlock:
            cidr: 172.18.0.4/32
      ports:
        - protocol: TCP
          port: 6443
